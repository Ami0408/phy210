<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040b12">
<title>PHY 210 :: Bench Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg0:#040b12;
    --panel:#0b2033;
    --panel2:#0e2740;
    --line:#163650;
    --cyan:#2ee6d6;
    --cyan-dim:#1a8f86;
    --amber:#ffb545;
    --red:#ff5d5d;
    --green:#3ddc84;
    --text:#dcedf5;
    --sub:#7ea3b8;
    --mono:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
    --disp:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #0d2c3f 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #0a2438 0%, transparent 55%),
      var(--bg0);
    color:var(--text);
    font-family:var(--disp);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;}
  .scope-grid{
    position:fixed;inset:0;pointer-events:none;opacity:.05;
    background-image:linear-gradient(var(--cyan) 1px, transparent 1px),linear-gradient(90deg,var(--cyan) 1px, transparent 1px);
    background-size:34px 34px;
  }
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 80px;position:relative;}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .chip-logo{
    width:42px;height:42px;border:1.5px solid var(--cyan-dim);border-radius:9px;
    display:flex;align-items:center;justify-content:center;background:var(--panel);flex:none;
  }
  .chip-logo svg{width:24px;height:24px;}
  .brand h1{font-size:19px;margin:0;letter-spacing:.4px;font-weight:700;}
  .brand .tag{font-family:var(--mono);color:var(--cyan);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
  .status{font-family:var(--mono);font-size:11px;color:var(--sub);text-align:right;line-height:1.5;}
  .status b{color:var(--cyan);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--sub);vertical-align:middle;}
  .dot.live{background:var(--green);box-shadow:0 0 8px var(--green);}

  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    position:relative;
    overflow:clip;
  }
  .panel::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:.6;z-index:25;
  }

  /* landing */
  .lede{font-size:14px;color:var(--sub);line-height:1.65;margin:2px 0 20px;max-width:58ch;}
  .lede code{color:var(--cyan);font-family:var(--mono);background:rgba(46,230,214,.08);padding:1px 5px;border-radius:4px;}

  .stat-strip{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 20px;background:rgba(0,0,0,.16);}
  .stat{flex:1;padding:12px 14px;border-right:1px solid var(--line);min-width:0;}
  .stat:last-child{border-right:none;}
  .s-num{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--cyan);line-height:1.1;}
  .s-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
  @media(max-width:600px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:12px;
    padding:18px;cursor:pointer;transition:.15s;text-align:left;
    font-family:inherit;color:var(--text);width:100%;
  }
  .mode-card:hover{border-color:var(--cyan-dim);background:rgba(46,230,214,.04);}
  .mode-card.active{border-color:var(--cyan);background:rgba(46,230,214,.08);box-shadow:0 0 0 1px var(--cyan) inset;}
  .mode-card:active{transform:scale(.99);}
  .mode-card .m-icon{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:rgba(46,230,214,.08);border:1px solid var(--line);font-size:16px;margin-bottom:11px;
  }
  .mode-card.active .m-icon{border-color:var(--cyan-dim);background:rgba(46,230,214,.18);}
  .mode-card h3{margin:0 0 5px;font-size:15px;display:flex;align-items:center;gap:7px;}
  .mode-card p{margin:0;font-size:12.5px;color:var(--sub);line-height:1.5;}
  .tick{color:var(--cyan);font-size:11px;}

  .topic-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
  .topic-pill{
    font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:20px;
    border:1px solid var(--line);color:var(--sub);
  }
  .btn{
    font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:.2px;
    background:var(--cyan);color:#00201d;border:none;border-radius:9px;
    padding:13px 22px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  }
  .btn:hover{background:#54f0e2;transform:translateY(-1px);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.ghost:hover{border-color:var(--cyan-dim);background:rgba(46,230,214,.06);}
  .btn.small{padding:9px 15px;font-size:13px;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* sticky session bar */
  .sess-bar{
    position:sticky;top:0;z-index:20;margin:-26px -26px 14px;padding:15px 26px;
    background:linear-gradient(180deg,rgba(11,32,51,.98),rgba(12,36,57,.88));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  }
  .bar-top{display:flex;align-items:center;gap:12px;}
  .progress-track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:110px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));transition:width .35s ease;}
  .qcount{font-family:var(--mono);font-size:12px;color:var(--sub);white-space:nowrap;}
  .timer{font-family:var(--mono);font-size:13px;color:var(--amber);white-space:nowrap;border:1px solid var(--line);padding:5px 10px;border-radius:7px;}
  .timer.low{color:var(--red);border-color:var(--red);animation:blink 1s steps(2,end) infinite;}
  @keyframes blink{50%{opacity:.45;}}
  .meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:#3d5a6e;}

  .qdots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;}
  .qdot{
    width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:transparent;
    color:var(--sub);font-family:var(--mono);font-size:11px;cursor:pointer;padding:0;transition:.15s;
    display:flex;align-items:center;justify-content:center;
  }
  .qdot:hover{border-color:var(--cyan-dim);color:var(--cyan);}
  .qdot.filled{border-color:var(--cyan-dim);color:var(--text);background:rgba(46,230,214,.08);}
  .qdot.correct{border-color:#1f6b48;background:rgba(61,220,132,.16);color:var(--green);}
  .qdot.partial{border-color:#6b5a1f;background:rgba(255,181,69,.16);color:var(--amber);}
  .qdot.incorrect{border-color:#6b2323;background:rgba(255,93,93,.16);color:var(--red);}
  .qdot.current{border-color:var(--cyan);background:var(--cyan);color:#00201d;font-weight:700;}

  .qmeta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .badge{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);color:var(--sub);text-transform:uppercase;letter-spacing:.5px;}
  .badge.topic{color:var(--cyan);border-color:var(--cyan-dim);}
  .badge.marks{color:var(--amber);border-color:#5a4626;}

  .qtext{font-size:17px;line-height:1.6;margin:0 0 18px;color:#f0f8fc;}
  textarea{
    width:100%;min-height:150px;background:#05131f;border:1px solid var(--line);
    border-radius:10px;color:var(--text);font-family:var(--mono);font-size:13.5px;
    padding:14px;line-height:1.6;resize:vertical;transition:border-color .15s,box-shadow .15s;
  }
  textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(46,230,214,.08);}
  textarea::placeholder{color:#3d5a6e;}
  .count-row{display:flex;justify-content:flex-end;font-family:var(--mono);font-size:10.5px;color:#3d5a6e;margin-top:6px;}

  .foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:10px;}

  /* feedback card */
  .fbcard{margin-top:18px;border-radius:10px;padding:16px 18px;border:1px solid var(--line);animation:rise .25s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .fbcard.correct{border-color:#1f6b48;background:rgba(61,220,132,.07);}
  .fbcard.partial{border-color:#6b5a1f;background:rgba(255,181,69,.07);}
  .fbcard.incorrect{border-color:#6b2323;background:rgba(255,93,93,.07);}
  .fbcard.pending{border-style:dashed;}
  .fb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .fb-verdict{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--sub);}
  .fbcard.correct .fb-verdict{color:var(--green);}
  .fbcard.partial .fb-verdict{color:var(--amber);}
  .fbcard.incorrect .fb-verdict{color:var(--red);}
  .fb-score{font-family:var(--mono);font-size:13px;color:var(--text);}
  .fb-text{font-size:13.5px;color:var(--text);line-height:1.6;margin:0 0 10px;}
  .fb-model{font-size:12.5px;color:var(--sub);line-height:1.6;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;}
  .fb-model b{color:var(--cyan);}

  .loading-line{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--sub);padding:14px 0;}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--cyan);animation:spin .7s linear infinite;flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .skel{height:11px;border-radius:6px;margin-bottom:9px;
    background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(46,230,214,.14),rgba(255,255,255,.04));
    background-size:200% 100%;animation:shimmer 1.15s linear infinite;}
  .skel.w70{width:70%;} .skel.w45{width:45%;} .skel.last{margin-bottom:0;}
  @keyframes shimmer{to{background-position:-200% 0;}}

  /* review */
  @property --p{syntax:'<number>';inherits:false;initial-value:0;}
  .score-hero{text-align:center;padding:6px 0 22px;}
  .ring{
    --p:0;width:170px;height:170px;margin:0 auto 14px;border-radius:50%;
    display:grid;place-items:center;position:relative;
    background:conic-gradient(var(--cyan) calc(var(--p) * 1%), rgba(255,255,255,.07) 0);
  }
  .ring::after{content:'';position:absolute;inset:9px;border-radius:50%;background:linear-gradient(180deg,#0b2033,#0e2740);}
  .ring-in{position:relative;text-align:center;z-index:1;}
  .ring-num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--cyan);line-height:1;}
  .ring-sub{font-family:var(--mono);font-size:11px;color:var(--sub);margin-top:6px;}
  .score-label{font-size:12px;color:var(--sub);margin-bottom:12px;text-transform:uppercase;letter-spacing:1.5px;font-family:var(--mono);}
  .tally{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
  .tally span{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--sub);}
  .tally .c{color:var(--green);border-color:#1f6b48;}
  .tally .p{color:var(--amber);border-color:#6b5a1f;}
  .tally .x{color:var(--red);border-color:#6b2323;}

  .rev-item{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .rev-item-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .rev-q{font-size:13.5px;color:#c9dde8;line-height:1.55;font-weight:600;}
  .rev-mark{font-family:var(--mono);font-size:12.5px;white-space:nowrap;padding:2px 8px;border-radius:6px;height:fit-content;}
  .rev-mark.correct{color:var(--green);background:rgba(61,220,132,.1);}
  .rev-mark.partial{color:var(--amber);background:rgba(255,181,69,.1);}
  .rev-mark.incorrect{color:var(--red);background:rgba(255,93,93,.1);}
  .rev-ans{font-family:var(--mono);font-size:12px;color:var(--sub);background:#05131f;border-radius:7px;padding:9px 11px;margin:8px 0;white-space:pre-wrap;}
  .rev-fb{font-size:12.5px;color:var(--text);line-height:1.6;margin-bottom:6px;}
  .rev-model{font-size:12px;color:var(--sub);line-height:1.6;}
  .rev-model b{color:var(--cyan);}

  /* settings / status */
  .icon-btn{
    margin-top:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;
    background:transparent;border:1px solid var(--line);color:var(--sub);
    border-radius:7px;padding:4px 9px;cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--cyan-dim);color:var(--cyan);}
  .setup-note{
    font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--amber);
    border:1px solid #5a4626;background:rgba(255,181,69,.07);
    border-radius:8px;padding:10px 12px;margin-bottom:16px;
  }
  .setup-note b{color:#ffd9a0;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(2,8,14,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;
    animation:rise .18s ease;
  }
  .modal{
    width:100%;max-width:470px;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:14px;padding:22px;max-height:88vh;overflow:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .modal-head h2{margin:0;font-size:16px;}
  .close-x{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:7px;
    width:28px;height:28px;flex:none;cursor:pointer;font-size:14px;line-height:1;}
  .close-x:hover{border-color:var(--red);color:var(--red);}
  .modal .hint{font-size:12px;color:var(--sub);line-height:1.6;margin:0 0 14px;}
  .modal .hint code{color:var(--cyan);font-family:var(--mono);}
  .kv{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11.5px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .kv:last-of-type{border-bottom:none;}
  .kv b{color:var(--sub);font-weight:400;}
  .kv i{font-style:normal;color:var(--text);text-align:right;word-break:break-all;}
  .pill-state{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
    text-transform:uppercase;letter-spacing:1px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--sub);}
  .pill-state.ok{color:var(--green);border-color:#1f6b48;}
  .pill-state.bad{color:var(--red);border-color:#6b2323;}
  .warn{font-size:11.5px;line-height:1.6;color:var(--amber);border-left:2px solid var(--amber);padding-left:10px;margin:12px 0 4px;}
  .test-out{font-family:var(--mono);font-size:11.5px;line-height:1.55;margin-top:10px;word-break:break-word;}
  .test-out.ok{color:var(--green);}
  .test-out.bad{color:var(--red);}
  .test-out.busy{color:var(--sub);}

  /* toasts */
  .toast-host{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;
    display:flex;flex-direction:column;gap:8px;width:min(430px,calc(100vw - 28px));}
  .toast{font-family:var(--mono);font-size:11.5px;line-height:1.55;border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;background:#08192a;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:rise .2s ease;}
  .toast.bad{border-color:#6b2323;color:#ffcaca;}
  .toast.ok{border-color:#1f6b48;color:#c9f6de;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .panel > *{animation:fadeUp .3s ease both;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 8px var(--green);}50%{box-shadow:0 0 14px var(--green);}}
  .dot.live{animation:pulseGlow 2.2s ease-in-out infinite;}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }

  .kbd{
    font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;color:var(--sub);
  }
  .hint-row{font-family:var(--mono);font-size:10.5px;color:#3d5a6e;margin-top:16px;text-align:center;}
  footer{text-align:center;margin-top:26px;font-family:var(--mono);font-size:10.5px;color:#2b4256;}

  /* ---------- responsive ---------- */
  @media(max-width:720px){
    .wrap{padding:18px 13px 60px;}
    header{gap:10px;margin-bottom:16px;}
    .brand h1{font-size:16.5px;}
    .brand .tag{font-size:9.5px;letter-spacing:1px;}
    .chip-logo{width:36px;height:36px;}
    .status{text-align:left;flex:1 1 100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .status > div{margin:0;}
    .icon-btn{margin-top:0;margin-left:auto;}
    .panel{padding:18px 15px;border-radius:12px;}
    .sess-bar{margin:-18px -15px 12px;padding:13px 15px;}
    .stat-strip{flex-wrap:wrap;}
    .stat{flex:1 1 50%;}
    .lede{font-size:13px;}
    .qtext{font-size:15.5px;}
    textarea{min-height:190px;font-size:16px;} /* 16px stops iOS zoom-on-focus */
    .btn{width:100%;padding:14px 18px;}
    .btn.small{width:auto;flex:1;}
    .btn-row{width:100%;}
    .foot-row{flex-direction:column-reverse;align-items:stretch;}
    .foot-row .btn-row{display:flex;}
    .ring{width:150px;height:150px;}
    .ring-num{font-size:30px;}
    .rev-item-head{flex-direction:column;gap:4px;}
    .modal{padding:18px 16px;border-radius:12px;max-height:92vh;}
  }
  @media(max-width:420px){
    .topic-pill{font-size:9.5px;padding:4px 8px;}
    .badge{font-size:9.5px;}
  }
  @supports(padding:max(0px)){
    .wrap{padding-left:max(13px,env(safe-area-inset-left));padding-right:max(13px,env(safe-area-inset-right));}
  }
</style>
</head>
<body>
<div class="scope-grid"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="chip-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2ee6d6" stroke-width="1.6"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>
      </div>
      <div>
        <h1>PHY 210 :: Bench Test</h1>
        <div class="tag">Basic Electronics · FUTA · Written-Answer Trainer</div>
      </div>
    </div>
    <div class="status" id="statusBox">
      <div aria-live="polite"><span class="dot" id="graderDot"></span><b id="graderText">Checking grader…</b></div>
      <div id="bankCount">— questions in bank</div>
    </div>
  </header>

  <div class="panel" id="app"></div>
  <footer>FIELD-EMISSION GRADE // PHY210 · FUTA Dept. of Physics · not affiliated with the university</footer>
</div>

<script>
/* ---------------------------------------------------------------
   QUESTION BANK — compiled from PHY 210 (Basic Electronics) past
   questions & tests, FUTA, sessions 2009/2010 through 2025/2026.

/* Fisher-Yates shuffle using crypto.getRandomValues */
function secureShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    const j = buf[0] % (i+1);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------------------------------------------------------------
   Grading — the API key lives ONLY in the serverless function
   (api/grade.js). Locally that reads .env; on Vercel it reads
   Project Settings → Environment Variables. The browser only ever
   posts to our own /api/grade route, so the key is never shipped
   to the client and students never see or pick a model.
--------------------------------------------------------------- */
const GRADE_ENDPOINT = '/api/grade';
const grader = { checked:false, ok:false, detail:'' };

function cfgReady(){ return grader.ok; }

async function probeGrader(){
  try{
    const r = await fetch(GRADE_ENDPOINT, {method:'GET', headers:{'Accept':'application/json'}});
    const ct = r.headers.get('content-type') || '';
    if(!ct.includes('json')){
      throw new Error(location.protocol === 'file:'
        ? 'Opened from disk (file://) — no server behind /api/grade. Run "vercel dev".'
        : '/api/grade did not return JSON — is the api/ folder deployed?');
    }
    const j = await r.json();
    grader.ok = Boolean(j.ok);
    grader.detail = '';
  }catch(e){
    grader.ok = false;
    /* Detail is for whoever is running the deployment, not for students. */
    grader.detail = e.message || String(e);
    console.warn('[grader]', grader.detail);
  }
  grader.checked = true;
  paintStatus();
}

function paintStatus(){
  const dot = document.getElementById('graderDot');
  const txt = document.getElementById('graderText');
  if(!dot || !txt) return;
  if(!grader.checked){ txt.textContent = 'Checking grader…'; return; }
  dot.classList.toggle('live', grader.ok);
  txt.textContent = grader.ok ? 'Grader ready' : 'Grader unavailable';
  txt.style.color = grader.ok ? '' : 'var(--red)';
}

async function updateStatus(){
  paintStatus();
  await probeGrader();
  if(document.getElementById('startBtn')) renderLanding();
}

function toast(msg, kind){
  let host = document.querySelector('.toast-host');
  if(!host){ host = document.createElement('div'); host.className = 'toast-host'; document.body.appendChild(host); }
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.setAttribute('role','status');
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>t.remove(), 6500);
}

async function gradeAnswer(question, marks, studentAnswer){
  let lastErr = null;
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const r = await fetch(GRADE_ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({question, marks, answer: studentAnswer || ''})
      });
      if(!r.ok){
        let detail = '';
        try{
          const j = await r.json();
          detail = j && j.error ? String(j.error) : '';
        }catch(_){
          detail = (await r.text().catch(()=>'')).slice(0,200);
        }
        const err = new Error(detail || ('Grader error ' + r.status));
        if(r.status >= 500 && attempt === 0){ lastErr = err; await pause(700); continue; }
        throw err;
      }
      const data = await r.json();
      if(data.error) throw new Error(data.error);
      return normaliseGrade(data, marks);
    }catch(e){
      lastErr = e;
      const transient = /failed to fetch|networkerror|load failed/i.test(e.message || '');
      if(transient && attempt === 0){ await pause(700); continue; }
      break;
    }
  }
  throw new Error(lastErr && lastErr.message ? lastErr.message : 'Grading failed.');
}

function normaliseGrade(g, marks){
  const out = {
    score: Math.max(0, Math.min(marks, Number(g.score) || 0)),
    verdict: g.verdict,
    feedback: String(g.feedback || ''),
    modelAnswer: String(g.modelAnswer || '')
  };
  if(!['correct','partial','incorrect'].includes(out.verdict)){
    out.verdict = out.score >= marks*0.85 ? 'correct' : (out.score > 0 ? 'partial' : 'incorrect');
  }
  return out;
}

/* Keyboard shortcuts — ⌘/Ctrl+Enter marks or advances, Alt+←/→ navigates */
function installKeyboardShortcuts(){
  document.addEventListener('keydown', e=>{
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
      const check  = document.getElementById('checkBtn');
      const next   = document.getElementById('nextBtn');
      const finish = document.getElementById('finishBtn');
      const start  = document.getElementById('startBtn');
      if(check && !check.disabled) check.click();
      else if(next) next.click();
      else if(finish) finish.click();
      else if(start) start.click();
      e.preventDefault();
      return;
    }
    if(e.altKey && e.key === 'ArrowRight'){
      const n = document.getElementById('nextBtn');
      if(n){ n.click(); e.preventDefault(); }
    }
    if(e.altKey && e.key === 'ArrowLeft'){
      const p = document.getElementById('prevBtn');
      if(p){ p.click(); e.preventDefault(); }
    }
  });
}

/* ---------------------------------------------------------------
   Landing screen
--------------------------------------------------------------- */
function renderLanding(){
  const totalMarks = BANK.reduce((s,q)=>s+q.m,0);
  const banner = grader.ok
    ? ``
    : (!grader.checked
        ? `<div class="setup-note dim">Checking the grader…</div>`
        : `<div class="setup-note">⚠ <b>Marking is temporarily unavailable.</b> Nothing to fix on your side — try again in a moment.</div>`);

  app.innerHTML = `
    <p class="lede">Answer exactly as you would on the script. An AI grader — playing your lecturer — marks it against what the question actually needs, then shows you precisely what you dropped marks on. Each session pulls <code>${QUESTIONS_PER_SESSION}</code> random questions from the bank.</p>

    <div class="stat-strip">
      <div class="stat"><div class="s-num">${BANK.length}</div><div class="s-lab">Questions</div></div>
      <div class="stat"><div class="s-num">${TOPICS.length}</div><div class="s-lab">Topics</div></div>
      <div class="stat"><div class="s-num">${totalMarks}</div><div class="s-lab">Marks total</div></div>
      <div class="stat"><div class="s-num">${QUESTIONS_PER_SESSION}</div><div class="s-lab">Per session</div></div>
    </div>

    <div class="mode-grid">
      <button type="button" class="mode-card ${state.mode==='practice'?'active':''}" data-mode="practice" aria-pressed="${state.mode==='practice'}">
        <span class="m-icon">⚡</span>
        <h3>Practice ${state.mode==='practice'?'<span class="tick">●</span>':''}</h3>
        <p>One question at a time, graded instantly with the model answer. No clock.</p>
      </button>
      <button type="button" class="mode-card ${state.mode==='exam'?'active':''}" data-mode="exam" aria-pressed="${state.mode==='exam'}">
        <span class="m-icon">⏱</span>
        <h3>Timed Exam ${state.mode==='exam'?'<span class="tick">●</span>':''}</h3>
        <p>25 minutes, all ${QUESTIONS_PER_SESSION} questions, free navigation. Marked on submit.</p>
      </button>
    </div>

    <div class="topic-row">${TOPICS.map(t=>`<span class="topic-pill">${escapeHtml(t)}</span>`).join('')}</div>
    ${banner}
    <div class="btn-row">
      <button class="btn" id="startBtn">Start session →</button>
      ${grader.ok ? `` : `<button class="btn ghost" id="retryGraderBtn">Retry connection</button>`}
    </div>
    <div class="hint-row"><span class="kbd">Ctrl</span> + <span class="kbd">↵</span> works as the primary action anywhere</div>
  `;

  app.querySelectorAll('.mode-card').forEach(c=>{
    c.addEventListener('click',()=>{ state.mode = c.dataset.mode; renderLanding(); });
  });
  const retry = document.getElementById('retryGraderBtn');
  if(retry) retry.addEventListener('click', async e=>{
    e.currentTarget.disabled = true;
    await probeGrader();
    renderLanding();
  });
  document.getElementById('startBtn').addEventListener('click', async ()=>{
    if(!grader.ok){
      toast('Marking is temporarily unavailable. Please try again in a moment.', 'bad');
      await probeGrader();
      renderLanding();
      return;
    }
    startSession();
  });
}

function startSession(){
  const picked = secureShuffle(BANK).slice(0, QUESTIONS_PER_SESSION);
  state.questions = picked;
  state.index = 0;
  state.answers = picked.map(()=>({answer:'', graded:false, verdict:null, score:0, feedback:'', modelAnswer:''}));
  state.timerSeconds = EXAM_SECONDS;
  clearInterval(state.timerHandle);
  if(state.mode === 'exam') startTimer();
  renderQuestion();
}

function startTimer(){
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.timerSeconds--;
    updateTimerDisplay();
    if(state.timerSeconds === 120) toast('Two minutes left.', 'bad');
    if(state.timerSeconds <= 0){
      clearInterval(state.timerHandle);
      submitExam();
    }
  },1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const m = Math.floor(state.timerSeconds/60), s = state.timerSeconds%60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('low', state.timerSeconds <= 120);
}

/* ---------------------------------------------------------------
   Question screen
--------------------------------------------------------------- */
function renderQuestion(){
  const q = state.questions[state.index];
  const a = state.answers[state.index];
  const answeredCount = state.answers.filter(x=>x.answer && x.answer.trim()).length;
  const pct = (answeredCount / state.questions.length) * 100;

  const dots = state.answers.map((ans,i)=>{
    let cls = '';
    if(ans.graded) cls = ans.verdict;
    else if(ans.answer && ans.answer.trim()) cls = 'filled';
    if(i === state.index) cls = 'current';
    return `<button type="button" class="qdot ${cls}" data-go="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="sess-bar">
      <div class="bar-top">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="qcount">Q${state.index+1} / ${state.questions.length}</div>
        ${state.mode==='exam' ? `<div class="timer" id="timerDisplay">25:00</div>` : ``}
      </div>
      <div class="meta-row">
        <span>${state.mode==='exam' ? 'Timed exam' : 'Practice'} · ${answeredCount}/${state.questions.length} attempted</span>
        <span><span class="kbd">Ctrl</span>+<span class="kbd">↵</span> ${state.mode==='practice' ? 'mark' : 'next'}</span>
      </div>
    </div>

    <div class="qdots">${dots}</div>

    <div class="qmeta">
      <span class="badge topic">${escapeHtml(q.t)}</span>
      <span class="badge marks">${q.m} marks</span>
    </div>
    <p class="qtext">${escapeHtml(q.q)}</p>
    <textarea id="answerBox" placeholder="Type your answer here — as much detail as you'd write on the script...">${escapeHtml(a.answer)}</textarea>
    <div class="count-row" id="wordCount"></div>
    <div id="feedbackSlot"></div>
    <div class="foot-row">
      <div class="btn-row">
        ${state.index>0 ? `<button class="btn ghost small" id="prevBtn">← Back</button>` : ``}
      </div>
      <div class="btn-row">
        ${state.mode==='practice' ? `<button class="btn small" id="checkBtn">Check answer</button>` : ``}
        ${state.index < state.questions.length-1
          ? `<button class="btn ghost small" id="nextBtn">${state.mode==='exam'?'Next →':'Skip / Next →'}</button>`
          : `<button class="btn small" id="finishBtn">${state.mode==='exam'?'Submit exam':'Finish session'}</button>`}
      </div>
    </div>
  `;

  if(state.mode === 'exam') updateTimerDisplay();
  if(a.graded) renderFeedbackCard(a);

  const box = document.getElementById('answerBox');
  const wc = document.getElementById('wordCount');
  const paintCount = ()=>{
    const words = box.value.trim() ? box.value.trim().split(/\s+/).length : 0;
    wc.textContent = words + (words === 1 ? ' word' : ' words');
  };
  paintCount();
  box.addEventListener('input', ()=>{
    state.answers[state.index].answer = box.value;
    paintCount();
  });

  app.querySelectorAll('[data-go]').forEach(d=>{
    d.addEventListener('click', ()=> goTo(Number(d.dataset.go)));
  });

  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=> goTo(state.index-1));

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=> goTo(state.index+1));

  const finishBtn = document.getElementById('finishBtn');
  if(finishBtn) finishBtn.addEventListener('click', ()=>{
    if(state.mode === 'exam') submitExam(); else finishPractice();
  });

  const checkBtn = document.getElementById('checkBtn');
  if(checkBtn) checkBtn.addEventListener('click', checkCurrentAnswer);
}

function stashAnswer(){
  const box = document.getElementById('answerBox');
  if(box) state.answers[state.index].answer = box.value;
}

function goTo(i){
  if(i < 0 || i >= state.questions.length) return;
  stashAnswer();
  state.index = i;
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function checkCurrentAnswer(){
  const q = state.questions[state.index];
  stashAnswer();
  const answerText = state.answers[state.index].answer;

  const slot = document.getElementById('feedbackSlot');
  slot.innerHTML = `
    <div class="fbcard pending">
      <div class="fb-head"><span class="fb-verdict">marking…</span><span class="fb-score">— / ${q.m}</span></div>
      <div class="skel"></div><div class="skel w70"></div><div class="skel w45 last"></div>
    </div>`;
  const cb0 = document.getElementById('checkBtn');
  if(cb0) cb0.disabled = true;

  try{
    const result = await gradeAnswer(q.q, q.m, answerText);
    state.answers[state.index] = {...state.answers[state.index], graded:true, ...result};
    renderFeedbackCard(state.answers[state.index]);
    refreshDots();
  }catch(e){
    slot.innerHTML = `
      <div class="fbcard incorrect">
        <div class="fb-head"><span class="fb-verdict">grading failed</span></div>
        <p class="fb-text">${escapeHtml(e.message || 'Marking failed. Please try again.')}</p>
        <button class="btn ghost small" id="retryMarkBtn">Try again</button>
      </div>`;
    const rb = document.getElementById('retryMarkBtn');
    if(rb) rb.addEventListener('click', ()=>checkCurrentAnswer());
  }
  const cb = document.getElementById('checkBtn');
  if(cb) cb.disabled = false;
}

function refreshDots(){
  app.querySelectorAll('[data-go]').forEach(d=>{
    const i = Number(d.dataset.go);
    const ans = state.answers[i];
    let cls = 'qdot';
    if(i === state.index) cls += ' current';
    else if(ans.graded) cls += ' ' + ans.verdict;
    else if(ans.answer && ans.answer.trim()) cls += ' filled';
    d.className = cls;
  });
}

function renderFeedbackCard(a){
  const slot = document.getElementById('feedbackSlot');
  if(!slot) return;
  slot.innerHTML = `
    <div class="fbcard ${a.verdict}">
      <div class="fb-head">
        <span class="fb-verdict">${escapeHtml(a.verdict)}</span>
        <span class="fb-score">${fmt(a.score)} / ${state.questions[state.index].m}</span>
      </div>
      <p class="fb-text">${escapeHtml(a.feedback || '')}</p>
      ${a.modelAnswer ? `<div class="fb-model"><b>Model answer —</b> ${escapeHtml(a.modelAnswer)}</div>` : ``}
    </div>
  `;
}

function finishPractice(){
  stashAnswer();
  const ungraded = state.answers.some(a=>!a.graded && a.answer && a.answer.trim());
  if(ungraded) submitExam(); else renderReview();
}

/* Grade every ungraded question, then show the review */
async function submitExam(){
  clearInterval(state.timerHandle);
  stashAnswer();

  app.innerHTML = `
    <div class="loading-line" id="gradeProgress" style="justify-content:center;padding:38px 0;font-size:14px;">
      <div class="spinner"></div> Marking question 1 of ${state.questions.length}…
    </div>
    <div class="progress-track" style="max-width:340px;margin:0 auto;">
      <div class="progress-fill" id="gradeBar" style="width:0%"></div>
    </div>
  `;

  for(let i=0;i<state.questions.length;i++){
    const el = document.getElementById('gradeProgress');
    const bar = document.getElementById('gradeBar');
    if(el) el.innerHTML = `<div class="spinner"></div> Marking question ${i+1} of ${state.questions.length}…`;
    if(bar) bar.style.width = ((i/state.questions.length)*100) + '%';

    if(!state.answers[i].graded){
      try{
        const result = await gradeAnswer(state.questions[i].q, state.questions[i].m, state.answers[i].answer);
        state.answers[i] = {...state.answers[i], graded:true, ...result};
      }catch(e){
        state.answers[i] = {...state.answers[i], graded:true, verdict:'incorrect', score:0,
          feedback:'Grading failed for this question — ' + (e.message || e), modelAnswer:''};
      }
    }
  }
  renderReview();
}

/* ---------------------------------------------------------------
   Review screen
--------------------------------------------------------------- */
function renderReview(){
  const totalMarks = state.questions.reduce((s,q)=>s+q.m,0);
  const totalScore = state.answers.reduce((s,a)=>s+(a.score||0),0);
  const pct = totalMarks>0 ? Math.round((totalScore/totalMarks)*100) : 0;
  const nC = state.answers.filter(a=>a.verdict==='correct').length;
  const nP = state.answers.filter(a=>a.verdict==='partial').length;
  const nX = state.answers.filter(a=>a.verdict==='incorrect').length;

  app.innerHTML = `
    <div class="score-hero">
      <div class="ring" id="ring">
        <div class="ring-in">
          <div class="ring-num" id="ringNum">0.0</div>
          <div class="ring-sub">of ${totalMarks}</div>
        </div>
      </div>
      <div class="score-label">${pct}% · ${state.mode==='exam'?'Timed Exam':'Practice Session'}</div>
      <div class="tally">
        <span class="c">${nC} correct</span>
        <span class="p">${nP} partial</span>
        <span class="x">${nX} incorrect</span>
      </div>
    </div>
    <div id="revList"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" id="againBtn">New session →</button>
    </div>
  `;

  const ring = document.getElementById('ring');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    ring.style.setProperty('--p', pct);
    document.getElementById('ringNum').textContent = totalScore.toFixed(1);
  }else{
    requestAnimationFrame(()=>{ ring.style.transition = '--p 1s ease'; ring.style.setProperty('--p', pct); });
    animateScore(document.getElementById('ringNum'), totalScore);
  }

  const list = document.getElementById('revList');
  state.questions.forEach((q,i)=>{
    const a = state.answers[i];
    const verdict = a.graded ? a.verdict : 'incorrect';
    const div = document.createElement('div');
    div.className = 'rev-item';
    div.innerHTML = `
      <div class="rev-item-head">
        <div class="rev-q">Q${i+1}. ${escapeHtml(q.q)}</div>
        <div class="rev-mark ${verdict}">${fmt(a.score)} / ${q.m}</div>
      </div>
      <div class="rev-ans">${a.answer && a.answer.trim() ? escapeHtml(a.answer) : '(no answer given)'}</div>
      <div class="rev-fb">${escapeHtml(a.feedback || '')}</div>
      ${a.modelAnswer ? `<div class="rev-model"><b>Model answer —</b> ${escapeHtml(a.modelAnswer)}</div>` : ``}
    `;
    list.appendChild(div);
  });

  document.getElementById('againBtn').addEventListener('click', renderLanding);
  window.scrollTo({top:0, behavior:'smooth'});
}

function animateScore(el, target){
  if(!el) return;
  const dur = 900, t0 = performance.now();
  function tick(now){
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = (target * (1 - Math.pow(1-k, 3))).toFixed(1);
    if(k < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------
   Boot
--------------------------------------------------------------- */
installKeyboardShortcuts();
renderLanding();
updateStatus();
</script>
